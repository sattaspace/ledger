# sattabase/backend/docker-compose.yml
services:
  sb-db:
    image: postgres:15-alpine
    container_name: sb-postgres
    environment:
      POSTGRES_DB: ${SB_DB_NAME}
      POSTGRES_USER: ${SB_DB_USER}
      POSTGRES_PASSWORD: ${SB_DB_PASSWORD}
    # No ports exposed to host to avoid conflict with CloudPanel PostgreSQL
    volumes:
      - sb_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SB_DB_USER} -d ${SB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sattabase_net

  sb-redis:
    image: redis:7-alpine
    container_name: sb-redis
    # No ports exposed to host to avoid conflict with CloudPanel Redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - sb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: always
    networks:
      - sattabase_net

  sb-backend:
    build: ./backend
    container_name: sb-backend
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:8086:8086" # Only accessible to local reverse proxy
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    depends_on:
      sb-db:
        condition: service_healthy
      sb-redis:
        condition: service_healthy
    networks:
      - sattabase_net

  sb-frontend:
    build: ./frontend
    container_name: sb-frontend
    restart: always
    ports:
      - "127.0.0.1:4321:4321" # Only accessible to local reverse proxy
    networks:
      - sattabase_net
  
  sb-sattadocs:
    build: ./sattadocs
    container_name: sb-sattadocs
    restart: always
    ports:
      - "127.0.0.1:4323:4323" # Only accessible to local reverse proxy
    networks:
      - sattabase_net

  sb-celery:
    build: ./backend
    container_name: sb-celery
    command: celery -A base worker -l INFO -Q default,websocket,celery
    env_file: .env
    volumes:
      - ./backend/media:/app/media
    restart: always
    depends_on:
      sb-db:
        condition: service_healthy
      sb-redis:
        condition: service_healthy
    networks:
      - sattabase_net

  sb-celery-beat:
    build: ./backend
    container_name: sb-celery-beat
    command: celery -A base beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    restart: always
    depends_on:
      sb-db:
        condition: service_healthy
      sb-redis:
        condition: service_healthy
    networks:
      - sattabase_net

networks:
  sattabase_net:
    driver: bridge

volumes:
  sb_postgres_data:
  sb_redis_data: