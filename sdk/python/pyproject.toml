[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sattabase-sdk"
version = "0.1.0"
description = "Python SDK for Sattabase — central auth, subscription, and access control platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["sattabase", "auth", "subscription", "billing", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
    "respx>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["sattabase_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
